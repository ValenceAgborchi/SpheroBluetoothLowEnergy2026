<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Spherov7 Controller</title>
   <link rel="stylesheet" href="styles.css">
   <!--Adding Google Font-->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
 <h1>Sphero Controller</h1>

 <div class="container">
   <textarea name="textarea" id="console" placeholder="🔴  Disconnected" readonly></textarea>
 </div>

 <div class="buttongroups">

   <p class="titles">CONNECTIONS</p>
   <div class="buttonclass">
     <button id="connecttosphero" class="connections">Connect to sphero</button>
     <button id="disconnectsphero" class="connections">Disconnect Sphero</button>
   </div>

   <div class="divider"></div>

   <p class="titles">MOVEMENT</p>
   <div class="buttonclass">
     <button id="roll" class="movement">Roll</button>
     <button id="spin" class="movement">Spin</button>
     <button id="stop" class="movement">STOP</button>
   </div>

   <div class="divider"></div>

   <p class="titles">COLOURS</p>
   <div class="buttonclass">
     <button id="red" class="red">Red</button>
     <button id="blue" class="blue">Blue</button>
     <button id="green" class="green">Green</button>
   </div>

 </div>
 <script src="index.js"></script>
</body>
</html>
